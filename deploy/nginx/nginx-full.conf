# Full HTTPS reverse proxy for the Vengeful Realms backend.
# setup_nginx.bat copies this file to C:\nginx\conf\nginx.conf after certificates exist.
#   api.vengefulrealms.com       -> 127.0.0.1:4000 (backend API)
#   dashboard.vengefulrealms.com -> 127.0.0.1:4002 (dashboard SPA)
# The ws relay on 7778 is exposed directly by the backend, not proxied here.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Default 32 is too small for these domain names across three server blocks
    server_names_hash_bucket_size 64;

    # One SAN certificate covers both subdomains (win-acme pemfiles output)
    ssl_certificate     C:/nginx/certs/api.vengefulrealms.com-fullchain.pem;
    ssl_certificate_key C:/nginx/certs/api.vengefulrealms.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server {
        listen 80 default_server;
        server_name api.vengefulrealms.com dashboard.vengefulrealms.com;

        # Keep serving ACME challenges so win-acme renewals succeed
        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name api.vengefulrealms.com;

        # GitHub webhook payloads exceed the 1m nginx default
        client_max_body_size 25m;

        # Login queue WebSocket. REST queue/profile calls are covered by location / below.
        location = /api/users/me/queue/ws {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }

        location / {
            proxy_pass http://127.0.0.1:4000;
            proxy_http_version 1.1;
            # Backend trusts loopback proxies (trust proxy) and rate limits per client IP
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The 165MB client zip streams through here, do not spool it to temp files
            proxy_buffering    off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    server {
        listen 443 ssl;
        server_name dashboard.vengefulrealms.com;

        location / {
            proxy_pass http://127.0.0.1:4002;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
