# Phase 1 config: HTTP only, used while win-acme obtains the first certificates.
# setup_nginx.bat copies this file to C:\nginx\conf\nginx.conf before issuance.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;

    # Default 32 is too small for these domain names
    server_names_hash_bucket_size 64;

    server {
        listen 80 default_server;
        server_name api.vengefulrealms.com dashboard.vengefulrealms.com;

        # win-acme filesystem validation writes tokens under this webroot
        location /.well-known/acme-challenge/ {
            root C:/nginx/html;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
